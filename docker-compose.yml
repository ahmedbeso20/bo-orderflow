services:
  # Required in .env before running in production:
  # SESSION_SECRET (>= 32 chars), DATA_ENCRYPTION_KEY (>= 32 chars), OWNER_PASSWORD (>= 12 chars)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderflow-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      DB_FILE: /app/data/omniarab.db
      DB_PATH: /app/data/omniarab.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001}
    volumes:
      - orderflow_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: node:22-alpine
    container_name: orderflow-web
    working_dir: /web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:3000
    volumes:
      - ./web:/web
    command: sh -c "npm ci && npm run build && npm run start"

volumes:
  orderflow_data:
