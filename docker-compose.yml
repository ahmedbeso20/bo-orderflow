services:
  # Required in .env before running in production:
  # DOMAIN=app.orderflow.eg (or localhost for local TLS)
  # SESSION_SECRET (>= 32 chars), DATA_ENCRYPTION_KEY (>= 32 chars), OWNER_PASSWORD (>= 12 chars)
  caddy:
    image: caddy:2-alpine
    container_name: orderflow-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderflow-api
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      DB_FILE: /app/data/omniarab.db
      DB_PATH: /app/data/omniarab.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost}
      APP_URL: ${APP_URL:-https://localhost}
      FRONTEND_ROUTING: ${FRONTEND_ROUTING:-path}
      SERVE_LEGACY_SPA: ${SERVE_LEGACY_SPA:-0}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ALLOW_IFRAME: ${ALLOW_IFRAME:-0}
    volumes:
      - orderflow_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: orderflow-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:3000
      ALLOW_IFRAME: ${ALLOW_IFRAME:-0}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/login"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  orderflow_data:
  caddy_data:
  caddy_config:
